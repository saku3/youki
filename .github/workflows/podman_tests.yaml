name: 🧪 Test for podman

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  podman-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install requirements
        run: sudo env PATH=$PATH just ci-prepare
      - name: Install CRIU from source
        run: |
          sudo apt-get install -y \
            libcap-dev libnet1-dev libnl-3-dev uuid-dev \
            libprotobuf-c-dev libprotobuf-dev protobuf-c-compiler protobuf-compiler
          git clone --depth 1 --branch criu-dev --single-branch \
            https://github.com/checkpoint-restore/criu.git ~/criu
          (cd ~/criu && sudo make -j $(nproc) install-criu)
          rm -rf ~/criu
          criu --version
      
      - name: Install skopeo and podman requirements
        run: |
          sudo apt-get install -y pkg-config libsystemd-dev libelf-dev libseccomp-dev libgpgme-dev libassuan-dev libbtrfs-dev libdevmapper-dev bats parallel socat protobuf-compiler jq conmon
          cargo install netavark aardvark-dns --locked
      
      - name: Copy binaries
        run: |
          sudo mkdir -p /usr/local/lib/podman
          sudo cp $(which netavark) /usr/local/lib/podman && sudo cp $(which netavark)-dhcp-proxy-client /usr/local/lib/podman && sudo cp $(which aardvark-dns) /usr/local/lib/podman
      
      # setup go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      
      # build skopeo
      # These build steps are taken from https://github.com/containers/skopeo/issues/1648#issuecomment-1132161659
      - name: Download skopeo 1.13.1 source # because ubuntu 22.04 does not have latest, and podman tests depend on that
        run: mkdir /tmp/skopeo && curl -fsSL "https://github.com/containers/skopeo/archive/v1.13.1.tar.gz" | tar -xzf - -C /tmp/skopeo --strip-components=1
      - name: Build skopeo
        run: cd /tmp/skopeo && DISABLE_DOCS=1 make
      - name: copy skopeo binaries
        run: sudo cp /tmp/skopeo/bin/skopeo /usr/local/bin/skopeo && sudo cp /tmp/skopeo/default-policy.json /etc/containers/policy.json
      - name: Skopeo version
        run: skopeo --version

      # build youki
      - run: just youki-release
      - run: sudo rm /usr/bin/crun && sudo cp youki /usr/local/bin && sudo cp youki /usr/bin/crun

      # build podman
      - name: Clone podman repository
        uses: actions/checkout@v4
        with:
          repository: containers/podman
      # gen-cert-pair in the system test helpers uses `openssl req -quiet`, which the
      # OpenSSL on ubuntu-24.04 does not support, so setup_suite fails before any test runs.
      # The option only silences progress output, so drop it.
      - name: Patch podman system test helpers
        run: |
          sed -i '/^[[:space:]]*-quiet \\$/d' test/system/helpers.bash
          if grep -n -- '-quiet' test/system/helpers.bash; then exit 1; fi
      - name: Build podman
        run: make binaries
      - name: Install tools
        run: make install.tools

      # run tests
      # These steps expand `make localsystem`, which stops after the sequential pass
      # fails and never runs the ci:parallel pass. Run both passes and fail at the end.
      - name: Clean podman state
        run: sudo rm -rf /root/.local/share/containers /root/.config/containers
      - name: Run podman test (sequential)
        id: sequential
        continue-on-error: true
        shell: bash # enables pipefail so that a failure of bats is not hidden by tee
        run: |
          sudo env PODMAN=$PWD/bin/podman QUADLET=$PWD/bin/quadlet \
            bats -T --filter-tags '!ci:parallel' test/system/ 2>&1 | tee sequential.log
      - name: Run podman test (parallel)
        id: parallel
        continue-on-error: true
        shell: bash
        run: |
          sudo env PODMAN=$PWD/bin/podman QUADLET=$PWD/bin/quadlet \
            bats -T --filter-tags ci:parallel -j $(nproc) test/system/ 2>&1 | tee parallel.log
      - name: Adding Summary
        if: always()
        run: |
          for log in sequential.log parallel.log; do
            [ -f "$log" ] || continue
            awk -v pass="${log%.log}" '
              /^1\.\.[0-9]+$/ { sub(/^1\.\./, ""); planned += $0 }
              /^ok / { if (/# skip/) skipped++; else passed++ }
              /^not ok / { failed++ }
              END {
                printf "%s: Planned: %d, Passed: %d, Failed: %d, Skipped: %d, Not run: %d\n\n",
                  pass, planned, passed, failed, skipped, planned - passed - failed - skipped
              }
            ' "$log"
            echo '```'
            grep '^not ok ' "$log" || echo "(no failures)"
            echo '```'
          done >> $GITHUB_STEP_SUMMARY
      - name: Check test results
        if: steps.sequential.outcome != 'success' || steps.parallel.outcome != 'success'
        run: |
          echo "sequential: ${{ steps.sequential.outcome }}, parallel: ${{ steps.parallel.outcome }}"
          exit 1
